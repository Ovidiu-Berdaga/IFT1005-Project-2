<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    
    <title>SantéHub</title>
  </head>

  <body>
    <div id="ajouter" class="ancre_body"></div>
    <header>
      <div class="header_div_gauche">
        <picture class="header_container_logo">
          <img src="./media/logo.svg" alt="logo" />
        </picture>
        <span class="header_titre">SantéHub</span>
      </div>
      <div class="header_div_droite">
        <ul>
          <li><a href="#ajouter">Ajouter</a></li>
          <li><a href="#progres">Progrès</a></li>
          <li><a href="#suivi">Suivi</a></li>
        </ul>
      </div>
    </header>
    <section class="container container_form">
      <div class="hero">
        <h1>Tableau de bord</h1>
        <p>Suivez vos habitudes quotidiennes et surveillez vos progrès</p>
      </div>
      <form class="form">
        <h2>Ajouter une habitude quotidienne</h2>
        <ul class="rangee_form">
          <li>
            <label for="habitude">Habitude</label>
            <div class="container_select">
              <select name="habitudes" id="habitude" required>
                <option value="sommeil">Sommeil</option>
                <option value="sport">Sport</option>
                <option value="lecture">Lecture</option>
                <option value="hydratation">Hydratation</option>
              </select>
            </div>
          </li>
          <li>
            <label for="quantite">Quantité</label>
            <input type="number" id="quantite" required />
          </li>
          <li>
            <label for="unite">Unité</label>
            <div class="container_select">
              <select name="unite" id="unite" required >
                <option value="heure">Heure</option>
                <option value="minute">Minute</option>
              </select>
            </div>
          </li>
          <li class="container_button">
            <button onclick="validate_form()">+ Ajouter</button>
          </li>
        </ul>
      </form>
      <div id="progres" class="ancre_scroll"></div>
    </section>
    <section class="container container_progres">
      <div class="container_titre_section">
        <h3>Progrès du jour</h3>
      </div>
      <div class="carte carte_hydratation">
        <div class="container_logo_titre">
          <picture class="container_logo">
            <img src="./media/hydratation.svg" alt="hydratation">
          </picture>
          <h4 class="titre">Hydratation</h4>
        </div>
        <div class="container_stats">
          <span class="fraction">0/8</span>
          <span class="pourcentage">0%</span>
        </div>
        <div class="container_mesure">
          <span class="mesure">verres</span>
        </div>
      </div>
      <div class="carte carte_sommeil">
        <div class="container_logo_titre">
          <picture class="container_logo">
            <img src="./media/sommeil.svg" alt="hydratation">
          </picture>
          <h4 class="titre">Sommeil</h4>
        </div>
        <div class="container_stats">
          <span class="fraction">0/8</span>
          <span class="pourcentage">0%</span>
        </div>
        <div class="container_mesure">
          <span class="mesure">heures</span>
        </div>
      </div>
      <div class="carte carte_lecture">
        <div class="container_logo_titre">
          <picture class="container_logo">
            <img src="./media/lecture.svg" alt="hydratation">
          </picture>
          <h4 class="titre">Lecture</h4>
        </div>
        <div class="container_stats">
          <span class="fraction">0/30</span>
          <span class="pourcentage">0%</span>
        </div>
        <div class="container_mesure">
          <span class="mesure">minutes</span>
        </div>
      </div>
      <div class="carte carte_sport">
        <div class="container_logo_titre">
          <picture class="container_logo">
            <img src="./media/sport.svg" alt="hydratation">
          </picture>
          <h4 class="titre">Sport</h4>
        </div>
        <div class="container_stats">
          <span class="fraction">0/60</span>
          <span class="pourcentage">0%</span>
        </div>
        <div class="container_mesure">
          <span class="mesure">minutes</span>
        </div>
      </div>
    </section>
