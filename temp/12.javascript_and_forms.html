<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        function validate_form(){
            if (document.forms[0].userName.value == "" ){
                alert("Name can not be empty");
                return false;
            }

            if (document.forms[0].age.value ==  "" ){
                alert("Age can not be empty");
                return false;
            }

            if (document.forms[0].age.value <  18 ){
                alert("You are underage");
                return false;
            }
         }

         function validate_email(){
            if (document.forms[1].email.value.includes("@")){
                alert("Right format email");
                return false;
            }
            else
            {
                alert("Wrong format email");
                return false;
            }
         }

    </script>

</head>
<body>
    
    <form>
        <label for="userName">userName:</label>
        <input type="text" id="userName">
        <br>
        <label for="age">Age:</label>
        <input type="number" id="age">
        <br>
        <button onclick="validate_form()">Send</button>
    </form>

    <h2>Join our newsletter:</h2>
     <form>
        <label for="email">Email:</label>
        <input type="text" id="email">
        <br>
        <button onclick="validate_email()">Send</button>
    </form>

</body>
</html>
