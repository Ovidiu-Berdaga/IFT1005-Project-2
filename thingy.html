<!DOCTYPE html>

<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>xd</title>
        <style>
            :root{
                font-size: 2.5vh;
                font-family: Arial, sans-serif;
            }

            input::-webkit-inner-spin-button, input::-webkit-outer-spin-button {
                appearance: none;
            }

            #suivi {
                border: 2px solid lightgray;
                border-radius: 10px;
                margin-left: 50px;
                width: calc(100% - 100px);

            }

            table {
                border-collapse: collapse;
                width: 95%;
                margin: 20px auto;
                text-align: left;
            }
            
            th, td {
                padding: 6px;
                vertical-align: bottom;
            }

            tr{
                border-bottom: 1px solid grey;
            }

            table caption {
                font-size: 3vh;
                margin-bottom: 10px;
                text-align: left;
            }

            .tb_1 {
                width: 30%;
            }

            .tb_2 {
                width: 20%;
            }

            .tb_3 {
                width: 35%;
                display: flex;
                align-items: center;
                width: 100%;
                gap: 4px;
            }

            .tb_4 {
                width: 15%;
                text-align: right;
            }

            progress{
                appearance: none;
                border-radius: 200px;
                color: black;
                box-sizing: border-box;
                flex: 1;
            }   

            progress::-webkit-progress-bar {
                background: lightgray;
                border-radius: 100px;
            }

            progress::-webkit-progress-value {
                background: black;
                border-radius: 100px;
            }

            progress::-moz-progress-bar { 
                background: black; 
            }

            label {
                margin-left: 5px;
            }
        </style>
    </head>

    <body>
        <div>
            <input type="number" id="inp_hyd" min="0"  required>
            <button>+ Ajouter Habitude</button>
        </div>
        
        <div id="suivi">
            <table>
                <caption>Suivi des habitudes</caption>
                <tr>
                    <th class="tb_1">Habitudes</th>
                    <th class="tb_2">But</th>
                    <th style="text-align:left;">Progrès</th>
                    <th class="tb_4">% Complété</th>
                </tr>
                <tr>
                    <td class="tb_1">Hydratation</td>
                    <td class="tb_2">8 verres</td>
                    <td class="tb_3"><progress id="hydrat" max="8" value="6">Hydratation</progress><label for="hydrat">8/8</label></td>
                    <td class="tb_4">75%</td>
                <tr>
                    <td class="tb_1">Sommeil</td>
                    <td class="tb_2">8 heures</td>
                    <td class="tb_3"><progress id="hydrat" max="8" value="6">Sommeil</progress><label for="hydrat">8/8</label></td>
                    <td class="tb_4">75%</td>
                </tr>
                <tr>
                    <td class="tb_1">Sport</td>
                    <td class="tb_2">60 minutes</td>
                    <td class="tb_3"><progress id="hydrat" max="60" value="6">Sport</progress><label for="hydrat">60/60</label></td>
                    <td class="tb_4">75%</td>
                </tr>
                <tr style="border: none;">
                    <td class="tb_1">Lecture</td>
                    <td class="tb_2">30 minutes</td>
                    <td class="tb_3"><progress id="hydrat" max="30" value="6">Lecture</progress><label for="hydrat">30/30</label></td>
                    <td class="tb_4">75%</td>
                </tr>

            </table>
        </div>
    </body>

</html>
